name: Finalize Vercel release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create the Vercel-authorized release commit
        run: |
          git config user.name "M665-alt"
          git config user.email "misbahugcwork@gmail.com"
          git rm -- .github/workflows/finalize-vercel-release.yml
          git commit -m "Finalize Vercel-compatible production output"
          git push origin HEAD:main
