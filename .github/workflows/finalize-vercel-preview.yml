name: Finalize Vercel Preview

on:
  push:
    branches:
      - concept-premium-portfolio

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create the Vercel-authorized preview commit
        run: |
          git config user.name "M665-alt"
          git config user.email "misbahugcwork@gmail.com"
          git rm .github/workflows/finalize-vercel-preview.yml
          git commit -m "Finalize premium portfolio preview"
          git push origin HEAD:concept-premium-portfolio
